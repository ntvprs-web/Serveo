<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SERVEO — Seed Database</title>
  <style>
    *{box-sizing:border-box} body{font-family:system-ui,sans-serif;background:#0b0f19;color:#e5e7eb;display:grid;place-items:center;min-height:100vh;min-height:100dvh;margin:0;padding:16px}
    .box{width:min(100%,460px);padding:clamp(1.2rem,5vw,2rem);background:#141924;border:1px solid #2a3142;border-radius:14px;text-align:center}
    .serveo-wordmark{margin:0 0 .6rem;color:#00d4aa;font-size:.78rem;font-weight:800;letter-spacing:.18em}
    button{max-width:100%;padding:.8rem 1.4rem;border:0;border-radius:10px;background:#00d4aa;color:#06231d;font-weight:700;font-size:1rem;cursor:pointer}
    button:disabled{opacity:.5;cursor:default}
    #log{margin-top:1rem;font-size:.9rem;color:#9ca3af;white-space:pre-line}
  </style>

</head>
<body>
  <div class="box">
    <p class="serveo-wordmark">SERVEO</p>
    <h2>Upload Starter Events</h2>
    <p>Uploads the 18 demo events from <code>data.js</code> into the Node.js backend API.</p>
    <button id="go">Upload Events</button>
    <div id="log"></div>
  </div>
 
  <script src="js/data.js"></script>
  <script type="module">
    import { addEvent } from './js/db.js';
 
    const btn = document.getElementById('go'), log = document.getElementById('log');
    btn.addEventListener('click', async () => {
      btn.disabled = true; log.textContent = 'Uploading...';
      try {
        let n = 0;
        for (const ev of EVENTS_DATA) {
          await addEvent(ev, {
            orgType: 'NGO',
            contact: '+91 98765 43210',
            email: 'contact@serveo.in'
          });
          n++;
          log.textContent = `Uploaded ${n} / ${EVENTS_DATA.length}`;
        }
        log.textContent = `✅ Done — ${n} events successfully uploaded to Node.js backend.`;
      } catch (e) {
        console.error(e);
        log.textContent = '❌ Failed: ' + e.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
