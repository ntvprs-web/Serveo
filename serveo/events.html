<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Browse all active community welfare events near you — blood drives, medical camps, food distribution, and more.">
    <title>Browse Events — SERVEO</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/events.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
</head>

<body>
    <div class="ambient-bg"></div>
    <div id="navbar-root"></div>

    <div class="events-page">
        <!-- Header -->
        <div class="events-header">
            <div class="container">
                <h1>Browse <span class="gradient-text">Events</span></h1>
                <p>Discover community welfare initiatives happening across India right now.</p>
            </div>
        </div>

        <div class="container">
            <!-- Controls -->
            <div class="events-controls">
                <div class="controls-left">
                    <div class="events-search">
                        <span>🔍</span>
                        <input type="text" id="event-search" placeholder="Search by event, city, organizer...">
                    </div>
                    <div class="filter-chips" id="category-filters">
                        <button class="filter-chip active" data-category="all">All</button>
                        <button class="filter-chip" data-category="blood">💉 Blood</button>
                        <button class="filter-chip" data-category="medical">🏥 Medical</button>
                        <button class="filter-chip" data-category="food">🍱 Food</button>
                        <button class="filter-chip" data-category="disaster">🆘 Disaster</button>
                        <button class="filter-chip" data-category="animal">🐾 Animal</button>
                        <button class="filter-chip" data-category="environment">🌱 Environ</button>
                        <button class="filter-chip" data-category="education">📚 Education</button>
                    </div>
                </div>
                <div class="controls-right">
                    <select class="sort-select" id="sort-select">
                        <option value="urgency">Sort: Urgency</option>
                        <option value="distance">Sort: Nearest</option>
                        <option value="date">Sort: Date</option>
                        <option value="volunteers">Sort: Help Needed</option>
                    </select>
                    <span class="results-count"><span id="results-count">18</span> events</span>
                </div>
            </div>

            <!-- Events Grid -->
            <div class="events-grid" id="events-grid"></div>
        </div>
    </div>

    <div id="footer-root"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('navbar-root').innerHTML = getNavbarHTML('events');
        document.getElementById('footer-root').innerHTML = getFooterHTML();

        let currentCategory = 'all';
        let currentSearch = '';
        let currentSort = 'urgency';

        // Urgency priority
        const urgencyOrder = { critical: 0, live: 1, ending: 2, upcoming: 3 };

        // Render events
        async function renderEvents() {
            const loc = userLocation || await getUserLocation();

            let events = [...EVENTS_DATA];

            // Filter category
            if (currentCategory !== 'all') {
                events = events.filter(e => e.category === currentCategory);
            }

            // Filter search
            if (currentSearch) {
                const q = currentSearch.toLowerCase();
                events = events.filter(e =>
                    e.title.toLowerCase().includes(q) ||
                    e.city.toLowerCase().includes(q) ||
                    e.organizer.toLowerCase().includes(q) ||
                    e.tags.some(t => t.includes(q))
                );
            }

            // Sort
            switch (currentSort) {
                case 'urgency':
                    events.sort((a, b) => (urgencyOrder[a.urgency] ?? 9) - (urgencyOrder[b.urgency] ?? 9));
                    break;
                case 'distance':
                    events.sort((a, b) =>
                        haversineDistance(loc.lat, loc.lng, a.lat, a.lng) -
                        haversineDistance(loc.lat, loc.lng, b.lat, b.lng)
                    );
                    break;
                case 'date':
                    events.sort((a, b) => new Date(a.date) - new Date(b.date));
                    break;
                case 'volunteers':
                    events.sort((a, b) =>
                        (a.volunteersJoined / a.volunteersNeeded) - (b.volunteersJoined / b.volunteersNeeded)
                    );
                    break;
            }

            // Render
            const grid = document.getElementById('events-grid');
            if (events.length === 0) {
                grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>No events found</h3>
            <p>Try adjusting your search or filters.</p>
          </div>`;
            } else {
                grid.innerHTML = events.map(e => {
                    const dist = haversineDistance(loc.lat, loc.lng, e.lat, e.lng);
                    return eventCardHTML(e, dist);
                }).join('');
            }

            document.getElementById('results-count').textContent = events.length;
        }

        // Category filters
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentCategory = chip.dataset.category;
                renderEvents();
            });
        });

        // Search
        document.getElementById('event-search').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderEvents();
        });

        // Sort
        document.getElementById('sort-select').addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderEvents();
        });

        // Initial render
        renderEvents();
    </script>
</body>

</html>
